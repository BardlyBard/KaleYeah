name: RapSoDee
options:
  bundleIdPrefix: local.rapsodee
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    from: "2.0.0"
targets:
  RapSoDee:
    type: application
    platform: macOS
    sources:
      - path: RapSoDee
        excludes:
          - "**/.DS_Store"
          - "Resources/Sounds/**"
          - "Resources/OpenSequence.mp4"
          - "Resources/Assets.xcassets"
      - path: RapSoDee/Resources/Assets.xcassets
        buildPhase: resources
        type: folder
      - path: RapSoDee/Resources/Sounds
        buildPhase: resources
        type: folder
      - path: RapSoDee/Resources/OpenSequence.mp4
        buildPhase: resources
    dependencies:
      - package: MSAL
        product: MSAL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.rapsodee.mail
        PRODUCT_NAME: RapSoDee
        INFOPLIST_FILE: RapSoDee/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: RapSoDee
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © Kale Yeah!"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: RapSoDee/RapSoDee.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "293476R5DQ"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: RapSoDee/RapSoDee.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.microsoft.identity.universalstorage
